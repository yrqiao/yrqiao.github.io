# 全部是同一页内的 hash —— _includes/tabs.html 监听 hashchange 切换面板，
# 不会触发页面刷新。
#   #about-me / #-news / #-publications  首页面板内的滚动锚点
#   #experience / #awards-and-service    切换到对应面板
main:
  - title: "About Me"
    url: "/#about-me"

  - title: "News"
    url: "/#-news"

  - title: "Publications"
    url: "/#-publications"

  - title: "Experience"
    url: "/#experience"

  - title: "Awards and Service"
    url: "/#awards-and-service"

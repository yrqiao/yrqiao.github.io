<!--
  页脚访客地图（MapMyVisitors）。

  参数存在 _config.yml 的 mapmyvisitors_params，是「? 之后的整段查询串」
  而不只是 d= 那个 token —— co / ct / cmo / cmn 是在它网站上选的配色，
  只留 token 会全部丢失。留空则整块不渲染，不会留下一个坏掉的空框。

  挂件自带访问计数，所以这里不再另外显示一行数字。原先并排的那个计数器
  （events.vercount.one，永久累计、不受时间窗口限制）已移除；要恢复的话
  见本文件的历史版本：git log -p _includes/visitor-map.html
-->
{% if site.mapmyvisitors_params and site.mapmyvisitors_params != "" %}
<div class="visitor-stats">
  <div class="visitor-stats__map" id="mapmyvisitors-mount"></div>
  <script>
    (function () {
      var mount = document.getElementById('mapmyvisitors-mount');
      if (!mount) return;
      var s = document.createElement('script');
      s.type = 'text/javascript';
      s.id = 'mapmyvisitors';
      // jsonify 负责转义，参数串里的引号不会截断这行 JS
      s.src = 'https://mapmyvisitors.com/map.js?' + {{ site.mapmyvisitors_params | jsonify }};
      mount.appendChild(s);
    })();
  </script>
</div>
{% endif %}

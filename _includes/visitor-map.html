<!--
  页脚访客统计。两个独立的第三方服务，各管一件事：

  1. vercount（events.vercount.one）—— 累计访问次数。
     免注册，按域名自动建账，数字从首次接入起永久累加，不做时间窗口截断。
     脚本会把结果写进下面 id 为 vercount_value_site_pv / site_uv 的元素
     （同时兼容 busuanzi_value_* 这套 id）。
     取代不蒜子：后者官方端点已 404。

  2. MapMyVisitors —— 访客地图。
     需要在 mapmyvisitors.com 注册并绑定本站域名，拿到专属 token，
     填进 _config.yml 的 mapmyvisitors_id。没填就整块不渲染，
     不会留下一个坏掉的空框。注意其免费版地图打点有保留期，
     不是永久 —— 所以累计总数才交给 vercount，没让它兼任。
-->
<div class="visitor-stats">
  <p class="visitor-stats__counter">
    Total visits <strong id="vercount_value_site_pv">–</strong>
    &nbsp;·&nbsp;
    Unique visitors <strong id="vercount_value_site_uv">–</strong>
  </p>

  {% if site.mapmyvisitors_id and site.mapmyvisitors_id != "" %}
  <div class="visitor-stats__map" id="mapmyvisitors-mount"></div>
  <script>
    (function () {
      var mount = document.getElementById('mapmyvisitors-mount');
      if (!mount) return;
      var s = document.createElement('script');
      s.type = 'text/javascript';
      s.id = 'mapmyvisitors';
      s.src = 'https://mapmyvisitors.com/map.js?d={{ site.mapmyvisitors_id | uri_escape }}&cl=ffffff&w=a';
      mount.appendChild(s);
    })();
  </script>
  {% endif %}
</div>

<script defer src="https://events.vercount.one/js"></script>

<script>
// 页内标签切换。三个面板在每个页面的 DOM 里都存在（见 _includes/panels.md），
// 所以切换只是改 hidden 属性 + 用 pushState 换地址栏，不刷新、不请求。
//
// 用 pushState 而不是 location.hash，是为了让地址栏保持 https://yrqiao.github.io/
// 和 /experience/ 这样的干净路径，不出现 #about-me、#-news 之类的片段。
// 这些路径都有真实的 Jekyll 页面，所以直接访问、刷新、分享链接一样能用。
(function () {
  var ROUTES = {
    '/': 'panel-home',
    '/experience/': 'panel-experience',
    '/awards-and-service/': 'panel-awards'
  };
  var TITLES = {
    'panel-experience': 'Experience',
    'panel-awards': 'Awards and Service'
  };
  var SITE_TITLE = {{ site.title | jsonify }};

  // /experience 和 /experience/ 视为同一个路由；Jekyll 产出的是带尾斜杠的目录。
  function normalize(path) {
    if (!path) return '/';
    return path.charAt(path.length - 1) === '/' ? path : path + '/';
  }

  function panelFor(path) {
    return ROUTES[normalize(path)] || 'panel-home';
  }

  // scrollTo 只在切到首页面板、且指定了 data-scroll 时使用
  function render(path, scrollTo, activeLink) {
    var target = panelFor(path);

    var panels = document.querySelectorAll('.tab-panel');
    if (!panels.length) return;
    Array.prototype.forEach.call(panels, function (p) {
      p.hidden = (p.id !== target);
    });

    // 同时最多只亮一个。点击时直接用被点的那一项；
    // 直接访问 / 刷新 / 前进后退时没有「被点的项」，就按路径回推第一个匹配的链接。
    var items = document.querySelectorAll('.masthead__menu-item:not(.masthead__menu-home-item)');
    var fallback = null;
    if (!activeLink) {
      Array.prototype.forEach.call(items, function (li) {
        var a = li.querySelector('a');
        if (!fallback && a && !a.getAttribute('data-scroll') &&
            normalize(a.getAttribute('href')) === normalize(path)) {
          fallback = li;
        }
      });
    }
    Array.prototype.forEach.call(items, function (li) {
      li.classList.toggle('is-active', li === (activeLink || fallback));
    });

    document.title = SITE_TITLE + ' - ' + (TITLES[target] || 'Homepage');

    var el = scrollTo && target === 'panel-home' ? document.getElementById(scrollTo) : null;
    if (el) { el.scrollIntoView(); } else { window.scrollTo(0, 0); }
  }

  function bind() {
    var links = document.querySelectorAll('.masthead__menu-item a');

    // main.min.js 执行了 $("a").smoothScroll({offset:-20})，它会对锚点链接
    // preventDefault 并自行滚动。这里的链接已经不带 # 了，理论上碰不到，
    // 但解绑掉更保险，免得它抢在前面处理。
    if (window.jQuery) { window.jQuery(links).off('click.smoothscroll'); }

    Array.prototype.forEach.call(links, function (a) {
      a.addEventListener('click', function (e) {
        var href = a.getAttribute('href') || '';
        // 外链、新窗口、组合键点击一律交还浏览器默认行为
        if (href.charAt(0) !== '/' || a.target || e.metaKey || e.ctrlKey ||
            e.shiftKey || e.altKey || e.button !== 0) return;
        e.preventDefault();
        var scrollTo = a.getAttribute('data-scroll');
        if (normalize(location.pathname) !== normalize(href)) {
          history.pushState({}, '', href);
        }
        render(href, scrollTo, a.parentNode);
      });
    });

    render(location.pathname, null, null);
  }

  // 前进/后退：pushState 不会触发 popstate，用户点浏览器按钮才会。
  window.addEventListener('popstate', function () {
    render(location.pathname, null, null);
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bind);
  } else {
    bind();
  }
})();
</script>
